<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">

    <title>Minhas Rádios</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header class="site-header">

        <button
            id="themeButton"
            class="theme-button"
            type="button"
            aria-label="Mudar tema"
            title="Mudar tema"
        >
            ☀️
        </button>

        <button
            id="randomButton"
            class="theme-button random-button"
            type="button"
            aria-label="Tocar rádio aleatória"
            title="Tocar rádio aleatória"
        >
            🎲
        </button>

        <div class="brand">
            <div class="brand-icon" aria-hidden="true">📻</div>

            <div>
                <h1>Minhas Rádios</h1>
                <p>Sua coleção de rádios online</p>
            </div>
        </div>

        <div class="search-box">
            <span aria-hidden="true">🔎</span>

            <input
                type="search"
                id="searchInput"
                placeholder="Buscar uma rádio..."
                aria-label="Buscar uma rádio"
                autocomplete="off"
            >
        </div>

        <div class="toolbar">

            <div class="popular-box">

                <button
                    id="popularButton"
                    class="popular-button"
                    type="button"
                    aria-expanded="false"
                    aria-haspopup="true"
                    aria-controls="popularDropdown"
                >
                    <span aria-hidden="true">🔥</span>
                    <span>Mais escutadas</span>
                </button>

                <div
                    id="popularDropdown"
                    class="popular-dropdown"
                ></div>

            </div>

            <div class="time-box">

                <button
                    id="timeButton"
                    class="recent-button"
                    type="button"
                    aria-expanded="false"
                    aria-haspopup="true"
                    aria-controls="timeDropdown"
                >
                    <span aria-hidden="true">⏱️</span>
                    <span>Mais tempo</span>
                </button>

                <div
                    id="timeDropdown"
                    class="recent-dropdown"
                ></div>

            </div>

            <div class="recent-box">

                <button
                    id="recentButton"
                    class="recent-button"
                    type="button"
                    aria-expanded="false"
                    aria-haspopup="true"
                    aria-controls="recentDropdown"
                >
                    <span aria-hidden="true">↻</span>
                    <span>Ouvidas recentemente</span>
                </button>

                <div
                    id="recentDropdown"
                    class="recent-dropdown"
                ></div>

            </div>

            <div class="sort-box">

                <label for="sortSelect">
                    Ordenar sessões
                </label>

                <select id="sortSelect">
                    <option value="original">
                        📄 Ordem original
                    </option>
                    <option value="az">
                        🔤 A → Z
                    </option>
                    <option value="za">
                        🔤 Z → A
                    </option>
                </select>

            </div>

        </div>

    </header>

    <main id="radioApp">

        <div class="loading">
            <div class="loading-icon" aria-hidden="true">📻</div>
            <p>Carregando suas rádios...</p>
        </div>

    </main>

    <footer class="player">

        <div class="player-inner">

            <div class="player-station-icon" aria-hidden="true">
                🎵
            </div>

            <div class="player-info">

                <div class="player-label">
                    TOCANDO AGORA
                </div>

                <div
                    id="currentStation"
                    class="player-station"
                    aria-live="polite"
                >
                    Nenhuma rádio selecionada
                </div>

                <div
                    id="playerStatus"
                    class="player-status"
                    aria-live="polite"
                >
                    Escolha uma rádio para começar
                </div>

            </div>

            <div class="player-controls">

                <button
                    id="playPauseButton"
                    class="play-button"
                    type="button"
                    aria-label="Reproduzir"
                    title="Reproduzir"
                >
                    ▶
                </button>

            </div>

            <div class="volume-control">

                <button
                    id="muteButton"
                    type="button"
                    aria-label="Mutar"
                    title="Mutar"
                >
                    🔊
                </button>

                <input
                    id="volumeControl"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.8"
                    aria-label="Volume"
                >

                <span
                    id="volumeValue"
                    class="volume-value"
                >
                    80
                </span>

            </div>

        </div>

    </footer>

    <audio
        id="audioPlayer"
        preload="none"
    ></audio>

</body>
</html>
