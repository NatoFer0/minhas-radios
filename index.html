<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minhas Rádios</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">

        <div class="brand">
            <div class="brand-icon">📻</div>

            <div>
                <h1>Minhas Rádios</h1>
                <p>Sua coleção de rádios online</p>
            </div>
        </div>

        <div class="search-box">
            <span>🔎</span>

            <input
                type="search"
                id="searchInput"
                placeholder="Buscar uma rádio..."
                autocomplete="off"
            >
        </div>

    </header>


    <main id="radioApp">

        <div class="loading">
            <div class="loading-icon">📻</div>
            <p>Carregando suas rádios...</p>
        </div>

    </main>


    <footer class="player">

        <div class="player-inner">

            <div class="player-station-icon">
                🎵
            </div>

            <div class="player-info">

                <div class="player-label">
                    TOCANDO AGORA
                </div>

                <div
                    id="currentStation"
                    class="player-station"
                >
                    Nenhuma rádio selecionada
                </div>

                <div
                    id="playerStatus"
                    class="player-status"
                >
                    Escolha uma rádio para começar
                </div>

            </div>


            <div class="player-controls">

                <button
                    id="playPauseButton"
                    class="play-button"
                    type="button"
                    title="Reproduzir"
                >
                    ▶
                </button>

            </div>


            <div class="volume-control">

                <button
                    id="muteButton"
                    type="button"
                    aria-label="Mutar"
                    title="Mutar"
                >
                    🔊
                </button>
            
                <input
                    id="volumeControl"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.8"
                    aria-label="Volume"
                >
            
            </div>


        </div>

    </footer>


    <audio
        id="audioPlayer"
        preload="none"
    ></audio>


    <script src="script.js"></script>

</body>
</html>
